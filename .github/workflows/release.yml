name: Build & Publish Release

on:
  push:
    branches:
      - master
    paths:
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # full history: the app's "What's new" page is generated from every commit of version.json
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '1.0.0'))")
          VERSION_CODE=$(python3 -c "import json; print(json.load(open('version.json')).get('version_code', 1))")
          CHANGELOG=$(python3 -c "import json; cl = json.load(open('version.json')).get('changelog', ''); print('\n'.join(cl) if isinstance(cl, list) else cl)")
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Restore Keystore from Secret
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          else
            echo "Generating release.jks on the fly..."
            keytool -genkeypair -v -keystore app/release.jks -alias antigem -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=BoopIDE, OU=Boop, O=Boop, L=City, ST=State, C=US"
          fi

      - name: Pre-bundle Antigravity CLI (agy)
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f "app/src/main/assets/agy_arm64.zip" ]; then
            echo "Pre-bundling agy ARM64 binary..."
            TMP_DIR=$(mktemp -d)
            TARBALL_URL="https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.13-5999302598852608/linux-arm/cli_linux_arm64.tar.gz"
            echo "Downloading from $TARBALL_URL..."
            curl -sSL "$TARBALL_URL" -o "$TMP_DIR/cli.tar.gz"
            tar -xzf "$TMP_DIR/cli.tar.gz" -C "$TMP_DIR"
            AGY_BIN=$(find "$TMP_DIR" -type f \( -name "antigravity" -o -name "agy" \) | head -n 1)
            if [ -n "$AGY_BIN" ] && [ -f "$AGY_BIN" ]; then
              echo "Compressing $AGY_BIN into app/src/main/assets/agy_arm64.zip..."
              (cd "$(dirname "$AGY_BIN")" && zip -9 "${GITHUB_WORKSPACE}/app/src/main/assets/agy_arm64.zip" "$(basename "$AGY_BIN")")
              ls -lh app/src/main/assets/agy_arm64.zip
            else
              echo "::warning::Antigravity binary not found in tarball"
            fi
            rm -rf "$TMP_DIR"
          fi

      - name: Build Release APKs
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.changelog }}
          generate_release_notes: true
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
